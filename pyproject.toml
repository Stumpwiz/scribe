[project]
name = "scribe"
version = "0.1.0"
description = "scribe using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.134.0,<1.0.0"
]

[project.scripts]
scribe = "scribe.main:run"
run_crew = "scribe.main:run"
train = "scribe.main:train"
replay = "scribe.main:replay"
test = "scribe.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
