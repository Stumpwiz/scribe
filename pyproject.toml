[project]
name = "scribe"
version = "0.1.0"
description = "Scribe: An AI-powered assistant for the secretary of the Mercy Ridge Residents Council"
authors = [{ name = "George Wright", email = "george@wrightstuff.site" }]
requires-python = ">=3.10,<3.14"

dependencies = [
    "crewai[tools]>=0.134.0,<1.0.0",
    "flask>=2.3.0,<3.0.0",
    "jinja2>=3.1.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "beautifulsoup4>=4.12",
    "tqdm>=4.66",
    "unstructured>=0.11.0",
    "chromadb>=0.4.0",
]

[project.scripts]
scribe = "scribe.main:run"
run_crew = "scribe.main:run"
train = "scribe.main:train"
replay = "scribe.main:replay"
test = "scribe.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "black",
    "mypy",
    "ipython"
]

[tool.crewai]
type = "crew"
