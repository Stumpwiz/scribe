ingest_unread_inbox_v1:
  description: >
    Manual run. Read UNREAD messages in Gmail INBOX. For each message:
    1) classify into attendance / agenda-typo / agenda-omission / agenda-newbiz / unknown
    2) apply label 'Scribe/Incoming' (add only; do not remove other labels)
    3) append one JSON log record (append-only)
    Non-destructive: do not reply, do not mark read, do not archive/move, do not download attachments.
  expected_output: >
    JSON log updated with one record per processed Gmail message, including:
    message_id, thread_id, internal_date, from, subject, snippet, classification,
    label_applied, and timestamp.
  agent: IngestorAgent
